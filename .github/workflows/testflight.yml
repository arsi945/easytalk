# Сборка iOS с подписью и загрузка в TestFlight. Запуск вручную: Actions → TestFlight → Run workflow.
# Подпись автоматическая (cloud-managed) через App Store Connect API key — p12 и профили вручную не нужны.
# Нужные secrets и разовая подготовка описаны в docs/CI.md.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Загрузить в TestFlight (иначе только подписанный архив)"
        type: boolean
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
      # Номер сборки должен расти с каждой загрузкой; 26 — последняя локальная сборка.
      BUILD_NUMBER_OFFSET: 26
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::secret for $name is not set (see docs/CI.md)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ]; then echo "::error::secret ASC_PRIVATE_KEY is not set (see docs/CI.md)"; missing=1; fi
          exit $missing

      - name: Write App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Bundle ID prefix
        if: env.BUNDLE_ID_PREFIX != '' && env.BUNDLE_ID_PREFIX != 'com.easytalk.personal'
        run: |
          # Только в копии раннера; репозиторий не меняется. Префикс общий для app, клавиатуры
          # и App Group: "com.easytalk.personal…" и "group.com.easytalk.personal".
          sed -i '' -E "s/([\".])com\.easytalk\.personal/\1${BUNDLE_ID_PREFIX}/g" ios/EasyTalk.xcodeproj/project.pbxproj
          grep -nE "PRODUCT_BUNDLE_IDENTIFIER|APP_GROUP_IDENTIFIER" ios/EasyTalk.xcodeproj/project.pbxproj | sort -u -k2

      - name: Build number
        run: |
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      # Automatic signing needs an "Apple Development" identity to archive. Left alone, Xcode creates a
      # new certificate on every fresh runner and the account runs out of them. Instead, one certificate
      # is created through the App Store Connect API (scripts/ci/create_signing_identity.py) and its
      # PKCS#12 file is kept in the Actions cache (private repo), encrypted with a password derived
      # from the ASC key. Nothing is exported from the keychain, so no UI prompt can block the job.
      # After revoking that certificate, bump "-v1" in the cache keys.
      - name: Signing keychain
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          PASS=$(printf '%s' "$ASC_PRIVATE_KEY" | shasum -a 256 | cut -c1-40)
          echo "::add-mask::$PASS"
          echo "IDENTITY_PASS=$PASS" >> "$GITHUB_ENV"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Restore development identity
        id: identity
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/identity/development.p12
          key: apple-development-identity-v1-${{ github.run_id }}
          restore-keys: apple-development-identity-v1-

      - name: Create development identity
        id: create-identity
        # No identity came back from the cache (cache-hit stays false for a prefix match, so use the matched key).
        if: steps.identity.outputs.cache-matched-key == ''
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/create_signing_identity.py "$RUNNER_TEMP/identity/development.p12"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Import development identity
        run: |
          security import "$RUNNER_TEMP/identity/development.p12" -k "$SIGNING_KEYCHAIN" -P "$IDENTITY_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IDENTITY_PASS" "$SIGNING_KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - name: Cache development identity
        if: steps.create-identity.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/identity/development.p12
          key: apple-development-identity-v1-${{ github.run_id }}

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/EasyTalk.xcodeproj \
            -scheme EasyTalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EasyTalk.xcarchive" \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Export and upload
        run: |
          set -o pipefail
          DESTINATION=export
          if [ "${{ inputs.upload }}" = "true" ]; then DESTINATION=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EasyTalk.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"

      - name: Upload logs and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ env.BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove key and keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/identity/development.p12"
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
